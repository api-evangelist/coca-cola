notes: >-
  The Coca-Cola Company operates MCP servers, but does not publish one an agent
  can reach. The "Soft Bottler Manager" ARM template in TCCC's own GitHub
  organization provisions three MCP servers — Cosmos DB, Blob Storage and
  Service Bus — into each BOTTLER's own Azure subscription as a spoke of a
  TCCC-operated Azure API Management hub. There is no hosted endpoint anyone can
  POST to and no npx/pip package anyone can install: the servers only exist once
  a bottler deploys the template into its own tenant, and all traffic is
  required to flow through the TCCC hub's APIM gateway behind an
  Ocp-Apim-Subscription-Key issued by TCCC. mode is therefore `none` — nobody
  ships a server a third party can call — and no MCPServer pointer is wired into
  apis.yml, because that pointer would assert a reachable agent surface that
  does not exist. No tool list is recorded: the repository names the servers but
  publishes no tools/list output, and inventing one would fabricate the very
  thing this file exists to measure.
