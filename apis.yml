description: >-
  The Coca-Cola Company is the world's largest non-alcoholic beverage company,
  owning and marketing more than 200 brands across sparkling soft drinks,
  water, hydration, sports, coffee, tea, juice, dairy, and plant-based drinks.
  The company sells its products in more than 200 countries through a
  bottling and distribution partner network. While Coca-Cola does not currently
  publish a broadly available public REST API, it is a heavy enterprise API
  consumer running an internal API program on MuleSoft that connects ERP,
  manufacturing, distribution, retail, marketing, and consumer engagement
  systems through a Center for Enablement (C4E) model. Historical Coca-Cola
  Enterprises (CCE) Product and Location APIs at developer.cokecce.com are no
  longer maintained as a public-facing developer program.
apis:
  - aid: coca-cola:coca-cola-internal-api-platform
    name: Coca-Cola Internal API Platform
    tags:
      - API Management
      - Enterprise Integration
      - Microservices
      - MuleSoft
    humanURL: https://web.archive.org/web/20260310100413/https://www.mulesoft.com/webinars/api/how-coca-cola-accelerates
    properties:
      - url: https://web.archive.org/web/20260310100413/https://www.mulesoft.com/webinars/api/how-coca-cola-accelerates
        type: CaseStudy
    x-pointer-note: >-
      Repointed 2026-09-05. Both MuleSoft webinar URLs this entry used to carry
      (/webinars/api/evaluation-to-implementation-coca-cola-company-journey and
      /webinars/api/how-coca-cola-accelerates) still return HTTP 200, but the
      pages MuleSoft now serves at those slugs are a generic "From Digital to
      Agentic Transformation" webinar with zero mentions of Coca-Cola — a
      soft-404, not a live citation. MuleSoft has scrubbed Coca-Cola from
      mulesoft.com entirely: /case-studies lists no Coca-Cola story and
      /case-studies/api/coca-cola is a hard 404. The Wayback snapshot of
      2026-03-10 is the only live URL that still carries the original content.
    description: >-
      Internal API platform built on MuleSoft Anypoint that exposes reusable
      experience, process, and system APIs across The Coca-Cola Company's
      bottling, marketing, ecommerce, and supply-chain operations. Governed
      by a central Center for Enablement (C4E) team that defines design
      standards, security policies, and reuse metrics. Not publicly accessible
      but a frequently cited reference architecture for Fortune 50 API
      programs.
    x-features:
      - API-led connectivity (system, process, experience APIs)
      - Center for Enablement (C4E) governance
      - Reusable assets across LOBs and bottling partners
      - OAuth 2.0 / API key based access for partners
    x-use-cases:
      - Bottler integrations
      - Retail and route-to-market data exchange
      - Consumer engagement (Freestyle, loyalty)
      - Supply-chain visibility and demand planning
  - aid: coca-cola:tccc-soft-bottler-agent-hub
    name: TCCC Soft Bottler Agent Hub
    tags:
      - Agents
      - API Management
      - Bottling
      - Multi-Tenant
    humanURL: https://github.com/The-Coca-Cola-Company/bottler-soft-infra-poc
    baseURL: https://tccc-soft-prod-apim-{uniqueid}.azure-api.net
    properties:
      - url: https://github.com/The-Coca-Cola-Company/bottler-soft-infra-poc
        type: SourceCode
      - url: https://raw.githubusercontent.com/The-Coca-Cola-Company/bottler-soft-infra-poc/main/README.md
        type: Documentation
    description: >-
      Partner-facing Azure API Management hub through which The Coca-Cola
      Company's bottlers register and operate AI agents. Documented publicly in
      TCCC's own GitHub organization as part of the "Soft Bottler Manager"
      deployment template: a bottler deploys a spoke (Azure Function App,
      Cosmos DB, Service Bus, Event Grid, ML workspace) into its own Azure
      tenant, then registers it with the TCCC hub via POST /api/agents/register
      using an Ocp-Apim-Subscription-Key issued by TCCC. The hub performs
      authentication, rate limiting and hub-spoke enforcement; no direct
      spoke-to-spoke traffic is permitted. The base URL is templated per
      deployment and the surface is partner-gated — it is not callable by a
      third party and publishes no OpenAPI.
    x-features:
      - Agent registration (POST /api/agents/register)
      - Spoke health check (GET /api/health, x-functions-key)
      - Hub-spoke isolation, one Azure tenant per bottler
      - MCP servers (Cosmos DB, Blob Storage, Service Bus) provisioned per spoke
      - Semantic Kernel plugins and AutoGen agent-to-agent orchestration
      - Azure AI Foundry model router
    x-use-cases:
      - Bottler financial analysis agents
      - Excel and document processing for bottler operations
      - Cross-tenant agent onboarding for the Coca-Cola bottling system
    x-access: partner-gated
    x-evidence:
      fetched: '2026-09-05'
      url: https://github.com/The-Coca-Cola-Company/bottler-soft-infra-poc
      http_status: 200
