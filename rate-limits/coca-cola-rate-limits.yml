description: >-
  The Coca-Cola Company documents no rate limits, no rate-limit response headers
  and no 429 behaviour anywhere public. There is no developer reference to read
  them from.
notes: >-
  Rewritten 2026-09-05, replacing a 2026-05-04 bulk-sweep placeholder that
  asserted a 429/503 response-code contract and a "Retry-After with jitter"
  backoff policy. Neither is documented by the company; both were generic
  defaults written into the structure, and an agent reading them would have
  believed Coca-Cola had published a throttling contract it has not. The only
  throttling the company describes in public is the statement, in its own
  bottler-agent repository, that rate limiting happens at the TCCC Azure API
  Management hub — with no numbers, windows or headers attached. limit_count is
  0 and that is the honest measurement.
observed:
  - surface: TCCC bottler agent hub (Azure API Management)
    claim: >-
      "External Request -> TCCC Hub (APIM) -> Bottler Agent ... Rate Limiting /
      Authentication / Hub-Spoke Check" — rate limiting is stated as an APIM
      hub responsibility with no published limit, window or header.
