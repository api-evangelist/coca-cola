description: >-
  The Coca-Cola Company publishes no API plans, no API price list and no
  "request API access" page — not even an enterprise contact-sales gate. There
  is nothing to price because there is no public developer program: the legacy
  Coca-Cola Enterprises program that once carried API terms of use is retired,
  and the company's live API surfaces are internal MuleSoft services and a
  partner-only Azure APIM hub for bottler agents, both governed by bilateral
  contracts that are never published.
notes: >-
  Rewritten 2026-09-05, replacing a 2026-05-04 bulk-sweep placeholder that
  invented a single "Enterprise Partner" plan with a "contact sales" price. No
  such plan is published anywhere by the company; the placeholder was a
  structural fill, not a finding. plan_count is 0 and that is the honest,
  useful measurement.
