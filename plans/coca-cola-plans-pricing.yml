notes: The Coca-Cola Company is a beverage manufacturer; its bottling, distribution, and retail integrations
  run over EDI and bilateral B2B contracts rather than a public developer API. The company does not publish
  a public commercial API price list. The single enterprise plan below preserves the API Commons Plans
  structure without fabricating numbers.
description: The Coca-Cola Company does not publicly document a developer API or price list. Bottler,
  retail, and distribution integrations are negotiated bilaterally and run over EDI / B2B contracts.
sources:
  - https://www.coca-colacompany.com
plans:
  - id: coca-cola-enterprise
    name: Enterprise Partner
    type: enterprise
    description: Custom-negotiated partner integration for bottlers, retailers, distributors, or supply-chain
      partners. No public pricing.
    entries:
      - label: Partner Integration
        name: partner_integration
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: Custom partner integration
      - name: Negotiated SLA
      - name: EDI / B2B connectivity
