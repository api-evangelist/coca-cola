openapi: 3.1.0
info:
  title: Coca-Cola API
  description: >-
    Coca-Cola provides partner APIs for supply chain integration, product information, and retail data exchange with bottling partners and distributors.
  version: '1.0'
  contact:
    name: Coca-Cola Developer Support
    url: https://www.coca-colacompany.com/innovation
externalDocs:
  description: Documentation
  url: https://www.coca-colacompany.com/innovation
servers:
  - url: https://api.coca-cola.com
    description: Production
tags:
  - name: Beverages
    description: Beverages operations
security:
  - bearerAuth: []
paths:
  /status:
    get:
      operationId: getStatus
      summary: Get API status
      description: >-
        Returns the current status of the API.
      tags:
        - Beverages
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  version:
                    type: string
        '401':
          description: Unauthorized
        '429':
          description: Too many requests
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
