source: >-
  Direct HTTPS probes of /.well-known/ paths on every host this record knows —
  the registrable domain and www, the consumer brand host, the data-trust and
  investor hosts, and the two retired Mashery hosts from the legacy Coca-Cola
  Enterprises developer program.
notes: >-
  No /.well-known/ document is served on any Coca-Cola host. Every corporate and
  brand host answers /.well-known/* with the site 404 page. developer.cokecce.com
  is still in DNS pointing at Mashery but the tenant is gone — Mashery returns
  "Unrecognized domain" and 403 on /.well-known/ paths — and api.cokecce.com
  returns Mashery's 596 "Service Not Found". No WellKnown or SecurityTxt pointer
  is wired into apis.yml, because this file records an absence, not a presence.
